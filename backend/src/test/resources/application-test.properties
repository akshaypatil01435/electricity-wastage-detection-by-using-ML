# Test profile: in-memory H2, no MySQL needed
spring.datasource.url=jdbc:h2:mem:wattvision_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-minutes=5
app.cors.allowed-origins=http://localhost:5173
app.admin.password=
