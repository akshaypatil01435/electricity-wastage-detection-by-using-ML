# ===================================================================
# WattVision AI — Local Development Profile (H2 In-Memory / File)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===================================================================

# In-memory H2 Database (No MySQL installation required)
spring.datasource.url=jdbc:h2:mem:wattvision_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & CORS
app.jwt.secret=${JWT_SECRET:wattvision-ai-super-secret-jwt-signing-key-32-chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}

# Admin Seed Account
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL:admin@wattvision.ai}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ML Bridge
app.ml.url=${ML_SERVICE_URL:http://localhost:8000}
app.ml.api-key=${ML_API_KEY:}
