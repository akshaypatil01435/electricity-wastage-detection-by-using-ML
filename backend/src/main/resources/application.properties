# ---- Database Configuration ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wattvision_db}
spring.datasource.username=${DB_USERNAME:wattvision}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=8080

# ---- JWT Security ----
# JWT_SECRET must be at least 32 characters.
app.jwt.secret=${JWT_SECRET:wattvision-ai-super-secret-jwt-signing-key-32-chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---- CORS Configuration ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Admin Seed Account ----
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL:admin@wattvision.ai}
app.admin.password=${ADMIN_PASSWORD:}

# ---- ML Microservice Bridge ----
app.ml.url=${ML_SERVICE_URL:http://localhost:8000}
app.ml.api-key=${ML_API_KEY:}
app.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:3000}
app.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:10000}

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
