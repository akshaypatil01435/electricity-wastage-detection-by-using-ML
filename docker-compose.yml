# WattVision AI - Production Multi-Service Architecture
# One-command stack: cp .env.example .env (fill in secrets) then docker compose up --build
services:
  mysql:
    image: mysql:8.4
    container_name: wattvision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: wattvision_db
      MYSQL_USER: wattvision
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wattvision_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ml-service:
    build: ./ml-service
    container_name: wattvision-ml-service
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY:-}
      MODEL_DIR: /app/models
    volumes:
      - ml_models:/app/models
    networks:
      - wattvision_net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    container_name: wattvision-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/wattvision_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: wattvision
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wattvision.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_API_KEY: ${ML_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
    networks:
      - wattvision_net
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_DEMO_MODE: "false"
    container_name: wattvision-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - wattvision_net
    ports:
      - "3000:80"

networks:
  wattvision_net:
    driver: bridge

volumes:
  mysql_data:
  ml_models:
